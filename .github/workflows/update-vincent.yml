name: Update 빈첸시오말씀방

on:
  schedule:
    # UTC 기준 → KST 06:11 / 10:11 / 18:11 (하루 3회)
    # 영상은 하루에 한 편이고, 깃허브 예약 실행은 이 저장소에서 2~4.5시간씩 밀려 시작되곤 한다(2026-09 확인).
    # 그래서 06시 회차가 밀려도 한낮 안에 한 번은 걸리도록 아침·오전·저녁에 둔다.
    # (예전엔 하루 7회였으나 Actions 사용량을 아끼려고 줄였다.)
    # 정각을 피해 :11 에 두어 부하가 몰리는 시간대를 비껴간다.
  - cron: '11 21,1,9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 빈첸시오말씀방 videos
        run: python scripts/fetch_vincent.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vincent.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 빈첸시오말씀방 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패, origin/main으로 rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
          fi
