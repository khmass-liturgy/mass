name: Update parish directory

on:
  schedule:
  # 매주 월요일 UTC 20:00 → KST 화요일 05:00 (전국 스캔이라 오래 걸려 새벽 실행)
  - cron: '0 20 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch nationwide parish directory + geocode
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: python scripts/fetch_parishes.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/parishes.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update parish directory ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
