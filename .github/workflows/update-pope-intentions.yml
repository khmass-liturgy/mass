name: Update Pope's prayer intentions (annual data)

on:
  schedule:
  # 매일 UTC 21:51 (KST 06:51) — 올해/내년 데이터 중 빈 달이 있으면 자동으로 채운다.
  # 정각을 피하고 다른 워크플로와 분을 달리해 지연·push 충돌을 줄인다.
  - cron: '51 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fill in missing Pope's prayer intention months
        run: python scripts/update_pope_intentions.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f data/pope_intentions.json ]; then
            echo "data/pope_intentions.json 파일이 없습니다. 위 단계 로그를 확인하세요."
            exit 0
          fi
          git add data/pope_intentions.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Pope's prayer intentions ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
