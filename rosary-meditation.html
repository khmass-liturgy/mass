<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>묵주기도 묵상글</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1A2744; --gold:#B98A2F; --gold-soft:#E4CE96;
  --ink:#22303F; --muted:#6B7A8C; --bg:#F7F4EE; --card:#FFFFFF; --line:#E3DCCD;
  --serif:'Noto Serif KR', serif; --sans:'Noto Sans KR', -apple-system, sans-serif;
  --c-joyful:#3F7FBF; --c-luminous:#C9971C; --c-sorrowful:#7B3B8F; --c-glorious:#B5452F;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.75;padding:0 0 40px}
a{color:var(--navy)}
header{background:linear-gradient(160deg,#1A2744,#2B3F6B);color:#fff;padding:26px 18px 22px;text-align:center;position:relative}
header h1{font-family:var(--serif);font-size:21px;font-weight:700}
header p{font-size:12.5px;color:#C7D4E4;margin-top:4px}
header .back{position:absolute;top:14px;left:14px;font-size:12px;color:#C7D4E4;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 12px}
main{max-width:720px;margin:0 auto;padding:18px 16px}

/* 신비 종류 탭 */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px 6px;cursor:pointer;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);line-height:1.3;position:relative}
.tab small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{color:#fff;border-color:transparent;background:var(--tc)}
.tab[aria-selected="true"] small{color:rgba(255,255,255,.85)}
.tab .today{position:absolute;top:-7px;right:-4px;background:var(--gold);color:#fff;font-family:var(--sans);font-size:10px;font-weight:700;border-radius:10px;padding:0 6px;line-height:16px}
.tab[data-key="joyful"]{--tc:var(--c-joyful)}
.tab[data-key="luminous"]{--tc:var(--c-luminous)}
.tab[data-key="sorrowful"]{--tc:var(--c-sorrowful)}
.tab[data-key="glorious"]{--tc:var(--c-glorious)}

.panel{display:none}
.panel.on{display:block}
.intro{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:14px}
.intro h2{font-family:var(--serif);font-size:18px;color:var(--pc);margin-bottom:4px}
.intro .day{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.intro p+p{margin-top:6px}

.decade{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(30,53,87,.05)}
.decade summary{cursor:pointer;list-style:none;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.decade summary::-webkit-details-marker{display:none}
.decade .no{flex:0 0 auto;background:var(--pc);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:1px 8px;margin-top:2px}
.decade .tt{flex:1;font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15px}
.decade .ar{flex:0 0 auto;font-size:12px;color:var(--gold);font-weight:700;margin-top:3px}
.decade[open] .ar{transform:rotate(180deg)}
.decade .bd{padding:0 16px 14px}
.decade .ref{font-size:12.5px;color:var(--pc);font-weight:700;margin-bottom:4px}
.decade .bd p{font-size:14.5px}
.decade .fruit{margin-top:10px;font-size:13px;color:var(--ink);background:#FBF7EC;border:1px dashed var(--gold-soft);border-radius:10px;padding:7px 11px}
.decade .fruit b{color:var(--gold)}

.panel[data-key="joyful"]{--pc:var(--c-joyful)}
.panel[data-key="luminous"]{--pc:var(--c-luminous)}
.panel[data-key="sorrowful"]{--pc:var(--c-sorrowful)}
.panel[data-key="glorious"]{--pc:var(--c-glorious)}

.tools{display:flex;justify-content:flex-end;gap:8px;margin:2px 0 8px}
.tools button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:3px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--sans)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.links a{display:inline-block;font-size:13px;font-weight:700;text-decoration:none;color:var(--navy);border:1.5px solid var(--gold);border-radius:20px;padding:6px 14px;background:var(--card)}
.note{font-size:12.5px;color:var(--muted);margin-top:16px}

/* 묵상글 세트 선택 */
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:8px}
.sets{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(140px,1fr);overflow-x:auto;scrollbar-width:none;background:#ECE5D6;border-radius:12px;padding:3px;gap:3px}
.sets::-webkit-scrollbar{display:none}
.set{appearance:none;border:0;background:transparent;border-radius:9px;padding:7px 4px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:700;color:var(--muted);line-height:1.3}
.set small{display:block;font-weight:400;font-size:11px}
.set[aria-pressed="true"]{background:var(--card);color:var(--navy);box-shadow:0 1px 4px rgba(30,53,87,.12)}
.sticky .tabs{position:static}

/* 성바오로딸 세트: 묵주알 타임라인 + 성경 말씀 카드 */
.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.order h3{font-family:var(--serif);font-size:14px;color:var(--navy);margin-bottom:8px}
.order ol{list-style:none;display:flex;flex-wrap:wrap;gap:5px 4px;align-items:center}
.order li{font-size:12px;background:#F4EFE3;border-radius:12px;padding:2px 9px;white-space:nowrap}
.order li.rep{background:var(--pc);color:#fff}
.order li.sep{background:none;padding:0 1px;color:var(--gold)}
.order .loop{font-size:11.5px;color:var(--muted);margin-top:6px}
.beads{position:relative;padding-left:34px}
.beads::before{content:'';position:absolute;left:13px;top:14px;bottom:14px;width:2px;background:linear-gradient(var(--pc),var(--gold-soft))}
.bead{position:relative;margin-bottom:14px}
.bead .dot{position:absolute;left:-34px;top:12px;width:28px;height:28px;border-radius:50%;background:var(--pc);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px var(--bg)}
.bead .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 15px 13px;box-shadow:0 2px 8px rgba(30,53,87,.05)}
.bead h3{font-family:var(--serif);font-size:15px;color:var(--navy);margin-bottom:8px;line-height:1.5}
.bead blockquote{position:relative;font-family:var(--serif);font-size:14.5px;line-height:1.9;color:var(--ink);padding:2px 0 0 14px;border-left:3px solid var(--gold-soft)}
.bead .src{margin-top:6px;text-align:right;font-size:12.5px;font-weight:700;color:var(--pc)}
.bead .card p{font-size:14.5px;margin-top:6px}
.bead .ref{font-size:12.5px;color:var(--pc);font-weight:700;margin-bottom:4px}
.bead .fruit{margin-top:10px;font-size:13px;background:#FBF7EC;border:1px dashed var(--gold-soft);border-radius:10px;padding:7px 11px}
.bead .fruit b{color:var(--gold)}
.bead .trad{font-size:13.5px;color:var(--muted);background:#FBF7EC;border:1px dashed var(--gold-soft);border-radius:10px;padding:8px 11px}
@media (max-width:380px){.tab{font-size:13px}}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← 홈</a>
  <h1>묵주기도 묵상글</h1>
  <p>환희 · 빛 · 고통 · 영광의 신비 — 여러 단체의 묵상글 모음</p>
</header>

<main>
  <div class="sticky">
    <div class="sets" id="sets" role="group" aria-label="묵상글 종류"></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div>
  <div class="tools"><button type="button" id="toggleAll">모두 펼치기</button></div>
  <div id="panels"></div>

  <div class="links">
    <a href="rosary-guide.html">묵주기도 바치는 요령 →</a>
    <a id="ytLink" href="https://youtube.com/playlist?list=PLpB9z9SOeZQc92kRSSNEqKXf1VeNhmkyR" target="_blank" rel="noopener">▶ 이 신비 함께 바치기</a>
  </div>

  <p class="note" id="setNote"></p>
</main>

<script>

    glorious:[
      { q:'천사가 여자들에게 말하였다. “두려워하지 마라. 너희가 십자가에 못 박히신 예수님을 찾는 줄을 나는 안다. 그분께서는 여기에 계시지 않는다. 말씀하신 대로 그분께서는 되살아나셨다. 와서 그분께서 누워 계셨던 곳을 보아라. 그러니 서둘러 그분의 제자들에게 가서 이렇게 일러라. ‘그분께서는 죽은 이들 가운데에서 되살아나셨습니다. 이제 여러분보다 먼저 갈릴래아로 가실 터이니, 여러분은 그분을 거기에서 뵙게 될 것입니다.’ 이것이 내가 너희에게 알리는 말이다.” 그 여자들은 두려워하면서도 크게 기뻐하며 서둘러 무덤을 떠나, 제자들에게 소식을 전하러 달려갔다.', ref:'마태 28,5-8' },
      { q:'예수님께서는 그들을 베타니아 근처까지 데리고 나가신 다음, 손을 드시어 그들에게 강복하셨다. 이렇게 강복하시며 그들을 떠나 하늘로 올라가셨다. 그들은 예수님께 경배하고 나서 크게 기뻐하며 예루살렘으로 돌아갔다. 그리고 줄곧 성전에서 하느님을 찬미하며 지냈다.', ref:'루카 24,50-53' },
      { q:'오순절이 되었을 때 그들은 모두 한자리에 모여 있었다. 그런데 갑자기 하늘에서 거센 바람이 부는 듯한 소리가 나더니, 그들이 앉아 있는 온 집 안을 가득 채웠다. 그리고 불꽃 모양의 혀들이 나타나 갈라지면서 각 사람 위에 내려앉았다. 그러자 그들은 모두 성령으로 가득 차, 성령께서 표현의 능력을 주시는 대로 다른 언어들로 말하기 시작하였다.', ref:'사도 2,1-4' },
      { trad:true },
      { trad:true }
    ]
  };
  var PAULINE_INTRO = '묵주기도는 예수 그리스도의 일생을 묵상하며 성모 마리아와 함께 하느님의 구원 계획에 감사드리고 우리도 주님의 영광에 참여하기를 비는 기도로서, 우리를 예수님과 일치시켜 주는 좋은 기도입니다.';

  // 기본 해설 묵상 데이터는 MYSTERIES 안의 글에서 만든다.
  var BASIC = {};
  MYSTERIES.forEach(function(m){
    BASIC[m.key] = m.decades.map(function(d){ return { ref:d.ref, text:d.m, fruit:d.f }; });
  });

  // ── 묵상글 세트 목록 ─────────────────────────────────────────
  // 다른 단체의 묵상글을 더하려면 위처럼 신비별 데이터(joyful·luminous·sorrowful·glorious
  // 각 5단)를 만들고 아래 배열에 항목 하나를 추가하면 된다. 첫 항목이 기본 세트다.
  //   id     : 영문 식별자(주소 ?set=id 로 바로 열기)
  //   icon/label/org : 상단 선택 버튼에 보이는 글
  //   layout : 'beads' = 묵주알 타임라인(모두 펼침) · 'cards' = 단별 접이식 카드
  //   intro  : 모든 신비에 공통인 소개 글(문자열). 없으면 각 신비의 기본 소개를 쓴다.
  //   data   : { 신비key: [ {q:성경 인용, text:해설, ref:출처 구절, fruit:묵상의 열매, trad:true(전승 신비)} ×5 ] }
  //   note   : 페이지 아래 출처 안내(HTML)
  var SETS = [
    { id:'pauline', icon:'📜', label:'성경 말씀 묵상', org:'성바오로딸수도회', layout:'beads',
      intro:PAULINE_INTRO, data:PAULINE,
      note:'※ 성경 말씀 묵상은 성바오로딸수도회 누리집 「가톨릭마당 › 기도 › 묵주기도」의 묵상 말씀을 정리한 것입니다(<a href="https://fsp.pauline.or.kr/?c=catechesis&amp;p=pray" target="_blank" rel="noopener">원문 보기</a>). 각 단의 제목은 『가톨릭 기도서』 표기로 맞추었고, 성경 본문은 원문 그대로 옮겼습니다.' },
    { id:'basic', icon:'📖', label:'해설 묵상', org:'묵상 해설 · 묵상의 열매', layout:'cards',
      data:BASIC,
      note:'※ 각 단의 제목은 한국 천주교 『가톨릭 기도서』를 따랐고, 요일 배분은 교황 성 요한 바오로 2세의 교서 『동정 마리아의 묵주기도(Rosarium Virginis Mariae)』를 참조하였습니다. ‘묵상의 열매’는 전통적으로 각 신비에서 청하는 은총입니다.' }
  ];
  function getSet(id){ return SETS.filter(function(x){ return x.id === id; })[0]; }

  // 묵주기도 순서 (성바오로딸수도회 안내 기준, 모든 세트 공통)
  var ORDER_START = ['성호경','십자가 친구','사도신경','주님의 기도','성모송 3번','영광송','구원의 기도'];
  var ORDER_DECADE = ['신비 묵상','주님의 기도','성모송 10번','영광송','구원의 기도'];

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // 한국 시간 기준 요일
  var kst = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000);
  var dow = kst.getDay();
  var todayKey = MYSTERIES.filter(function(m){ return m.days.indexOf(dow) >= 0; })[0].key;

  // 세트 선택은 이 기기에만 기억한다(실패해도 기본값으로 동작).
  var SET_KEY = 'rosaryMeditationSet';
  var curSet = SETS[0].id;
  try { var saved = localStorage.getItem(SET_KEY); if (getSet(saved)) curSet = saved; } catch (e) {}
  var qs = (location.search.match(/[?&]set=([\w-]+)/) || [])[1];
  if (getSet(qs)) curSet = qs;
  var curKey = todayKey;

  var tabsEl = document.getElementById('tabs');
  var panelsEl = document.getElementById('panels');
  tabsEl.innerHTML = MYSTERIES.map(function(m){
    return '<button type="button" class="tab" role="tab" data-key="' + m.key + '" aria-controls="p-' + m.key + '">' +
      esc(m.name.replace(' 신비','')) + '<small>' + esc(m.day) + '</small>' +
      (m.key === todayKey ? '<span class="today">오늘</span>' : '') + '</button>';
  }).join('');

  function introHtml(m, paras){
    return '<div class="intro"><h2>' + esc(m.name) + '</h2><div class="day">' + esc(m.day) + '요일에 바칩니다' +
      (m.key === todayKey ? ' · <b style="color:var(--gold)">오늘의 신비</b>' : '') + '</div>' +
      paras.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</div>';
  }
  function chips(list){
    return list.map(function(t){
      return '<li' + (/10번|신비 묵상/.test(t) ? ' class="rep"' : '') + '>' + esc(t) + '</li>';
    }).join('<li class="sep" aria-hidden="true">›</li>');
  }

  // 묵주기도 순서 안내 (두 세트 공통)
  function orderHtml(){
    return '<div class="order"><h3>🙏 묵주기도 순서</h3><ol>' + chips(ORDER_START) + '</ol>' +
      '<div class="loop">각 단마다 ↓ 다섯 번 되풀이</div><ol style="margin-top:4px">' + chips(ORDER_DECADE) + '</ol>' +
      '<div class="loop">다섯 단을 마친 뒤 성모찬송 · 성호경</div></div>';
  }

  var TRAD_HTML = '<div class="trad">성경에 직접 기록된 사건이 아니라 교회 <b>전승으로 이어져 내려온</b> 신비입니다. 성모님과 함께 하늘의 영광을 바라보며 조용히 묵상합니다.</div>';
  function decadeBody(d, refIcon){
    if (d.trad) return TRAD_HTML;
    var h = '';
    if (d.ref && !d.q) h += '<div class="ref">' + refIcon + esc(d.ref) + '</div>';
    if (d.q) h += '<blockquote>' + esc(d.q) + '</blockquote>' + (d.ref ? '<div class="src">— ' + esc(d.ref) + '</div>' : '');
    if (d.text) h += '<p>' + esc(d.text) + '</p>';
    if (d.fruit) h += '<div class="fruit"><b>묵상의 열매</b> · ' + esc(d.fruit) + '</div>';
    return h;
  }
  // 'cards': 단별 접이식 카드(처음엔 모두 펼침)
  function layoutCards(m, list){
    return list.map(function(d, i){
      return '<details class="decade" open><summary>' +
        '<span class="no">' + (i + 1) + '단</span><span class="tt">' + esc(m.decades[i].t) + '</span><span class="ar">▼</span></summary>' +
        '<div class="bd">' + decadeBody(d, '📖 ') + '</div></details>';
    }).join('');
  }
  // 'beads': 묵주알 타임라인에 모두 펼쳐 보여 준다.
  function layoutBeads(m, list){
    return '<div class="beads">' + list.map(function(d, i){
      return '<div class="bead"><span class="dot">' + (i + 1) + '</span><div class="card"><h3>' + esc(m.decades[i].t) + '</h3>' +
        decadeBody(d, '📖 ') + '</div></div>';
    }).join('') + '</div>';
  }
  function renderSet(set, m){
    var list = set.data[m.key] || [];
    return introHtml(m, set.intro ? [set.intro] : m.intro) + orderHtml() +
      (set.layout === 'beads' ? layoutBeads(m, list) : layoutCards(m, list));
  }

  var setsEl = document.getElementById('sets');
  setsEl.innerHTML = SETS.map(function(x){
    return '<button type="button" class="set" data-set="' + esc(x.id) + '">' + esc(x.icon + ' ' + x.label) + '<small>' + esc(x.org) + '</small></button>';
  }).join('');

  function render(){
    var set = getSet(curSet);
    panelsEl.innerHTML = MYSTERIES.map(function(m){
      return '<section class="panel" role="tabpanel" id="p-' + m.key + '" data-key="' + m.key + '">' + renderSet(set, m) + '</section>';
    }).join('');
    Array.prototype.forEach.call(setsEl.children, function(b){
      var on = b.dataset.set === curSet;
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (on && b.scrollIntoView && setsEl.scrollWidth > setsEl.clientWidth) b.scrollIntoView({ block:'nearest', inline:'nearest' });
    });
    document.getElementById('setNote').innerHTML = set.note || '';
    toggleBtn.parentNode.style.display = set.layout === 'cards' ? '' : 'none';
    select(curKey, false);
  }

  var ytLink = document.getElementById('ytLink');
  function select(key, push){
    var m = MYSTERIES.filter(function(x){ return x.key === key; })[0] || MYSTERIES[0];
    curKey = m.key;
    Array.prototype.forEach.call(tabsEl.children, function(b){ b.setAttribute('aria-selected', b.dataset.key === m.key ? 'true' : 'false'); });
    Array.prototype.forEach.call(panelsEl.children, function(p){ p.classList.toggle('on', p.dataset.key === m.key); });
    ytLink.href = 'https://www.youtube.com/watch?v=' + m.yt + '&list=' + YT_LIST;
    if (push && history.replaceState) history.replaceState(null, '', location.pathname + location.search + '#' + m.key);
    updateToggle();
  }
  tabsEl.addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (b) select(b.dataset.key, true);
  });
  setsEl.addEventListener('click', function(e){
    var b = e.target.closest('.set'); if (!b || b.dataset.set === curSet) return;
    curSet = b.dataset.set;
    try { localStorage.setItem(SET_KEY, curSet); } catch (e2) {}
    render();
  });

  var toggleBtn = document.getElementById('toggleAll');
  function current(){ return panelsEl.querySelector('.panel.on'); }
  function updateToggle(){
    var p = current(); if (!p) return;
    var all = p.querySelectorAll('.decade'), open = p.querySelectorAll('.decade[open]');
    toggleBtn.textContent = all.length && open.length === all.length ? '모두 접기' : '모두 펼치기';
  }
  toggleBtn.addEventListener('click', function(){
    var p = current(); if (!p) return;
    var all = p.querySelectorAll('.decade');
    var openAll = p.querySelectorAll('.decade[open]').length !== all.length;
    Array.prototype.forEach.call(all, function(d){ d.open = openAll; });
    updateToggle();
  });
  panelsEl.addEventListener('toggle', updateToggle, true);

  var hash = (location.hash || '').slice(1);
  if (MYSTERIES.some(function(m){ return m.key === hash; })) curKey = hash;
  render();
  window.addEventListener('hashchange', function(){ select(location.hash.slice(1), false); });
})();
</script>
</body>
</html>
