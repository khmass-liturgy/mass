name: Update Pope's prayer intention

on:
  schedule:
  # 매일 UTC 21:00 (KST 06:00)에 확인 — 월초에 새 지향이 올라오면 바로 반영
  - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Pope's monthly prayer intention
        run: python scripts/fetch_pope_intention.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pope_intention.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update Pope's prayer intention ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
