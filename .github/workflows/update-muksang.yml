name: Update 신부님 묵상글 posts

on:
  schedule:
 # UTC 기준 → KST 06:07 / 10:07 / 12:07 / 18:07 / 21:07 / 23:07
 # 정각(:00)은 깃허브 액션 부하가 몰려 지연되므로 워크플로마다 분을 달리 둔다.
 # 같은 시각에 여러 워크플로가 push 하면 서로 충돌하는 것도 함께 피한다.
  - cron: '7 1,3,9,12,14,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch 묵상 posts
        run: python scripts/fetch_muksang.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/muksang.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 묵상 posts ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
