name: Update 빈첸시오말씀방

on:
  schedule:
    # 깃허브 예약 실행은 이 저장소에서 예정 시각보다 2~4.5시간씩 밀려서 시작된다(2026-09 확인).
    # 그래서 '몇 시에 돌린다'가 아니라 '밀려도 아침에 한 번은 걸리도록' 촘촘히 깔아 둔다.
    # UTC 19,21,23,1,3 → KST 04:11 06:11 08:11 10:11 12:11 (지연을 더하면 아침~한낮에 분포)
    # UTC 9,14         → KST 18:11 23:11 (저녁·심야 보정)
    # 정각을 피해 :11 에 두어 부하가 몰리는 시간대를 비껴간다.
  - cron: '11 19,21,23,1,3,9,14 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 빈첸시오말씀방 videos
        run: python scripts/fetch_vincent.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vincent.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 빈첸시오말씀방 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
