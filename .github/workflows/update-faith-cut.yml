name: Update 가톨릭신문 신앙 한 컷

on:
  schedule:
    # UTC 기준 → KST 09:17 (금·토·일, 주 3회)
    # 신앙 한 컷은 매주 일요일 자로 나온다. 카드는 토·일에만 보이므로
    # 금요일부터 받아 두면 토·일 아침에 목록에 그 주 편이 들어 있다.
    # 일요일 아침에 새로 올라온 편도 잡도록 일요일 실행을 넣었다.
    # 정각을 피하고 다른 워크플로와 분을 달리해 지연·push 충돌을 줄인다.
  - cron: '17 0 * * 0,5,6'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 가톨릭신문 신앙 한 컷 목록
        run: python scripts/fetch_faith_cut.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/faith_cut.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 가톨릭신문 신앙 한 컷 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패, origin/main으로 rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
          fi
