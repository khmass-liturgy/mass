name: Update 오늘의 성경 한 장

on:
  schedule:
    # UTC 기준 → KST 21:17 (매일)
    # 오늘·내일 두 장을 받아 두므로, 저녁에 받아 두면 자정이 지나도 바로 읽을 수 있다.
    # 정각을 피하고 다른 워크플로와 분을 달리해 지연·push 충돌을 줄인다.
  - cron: '17 12 * * *'
  workflow_dispatch: {}
  # 스크립트나 이 워크플로를 고치면 바로 한 번 돌려 본문·음성을 다시 만든다.
  push:
    branches: [main]
    paths:
      - scripts/fetch_bible_today.py
      - .github/workflows/update-bible-today.yml

permissions:
  contents: write

concurrency:
  group: bible-today
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests edge-tts

      - name: Fetch 오늘·내일 성경 본문 + 읽어주기 음성
        run: python scripts/fetch_bible_today.py --audio

      # 음성 mp3 는 저장소를 키우지 않도록 Release 'bible-audio' 에 올리고,
      # 오늘·내일 것 말고는 지운다. 업로드가 끝난 뒤에야 JSON 을 커밋한다.
      - name: Upload 음성 to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view bible-audio >/dev/null 2>&1 || \
            gh release create bible-audio --title "성경 읽어주기 음성" \
              --notes "오늘의 성경 한 장 읽어주기 음성 (자동 생성, 오늘·내일 두 장만 보관)" --latest=false
          # gh release upload 는 mp3 를 application/octet-stream 으로 올려 아이폰 사파리가
          # 재생하지 못할 수 있다. API 로 직접 올려 Content-Type: audio/mpeg 을 붙인다.
          rel_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/bible-audio" -q .id)
          for f in build/bible_audio/*.mp3; do
            [ -e "$f" ] || continue
            name=$(basename "$f")
            gh release delete-asset bible-audio "$name" -y 2>/dev/null || true
            curl -sSf -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Content-Type: audio/mpeg" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${rel_id}/assets?name=${name}" >/dev/null
            echo "uploaded $name"
          done
          keep=$(python -c "import json;print(' '.join(d['date']+'.mp3' for d in json.load(open('data/bible_today.json',encoding='utf-8'))['days']))")
          for a in $(gh release view bible-audio --json assets -q '.assets[].name'); do
            case " $keep " in *" $a "*) ;; *) gh release delete-asset bible-audio "$a" -y ;; esac
          done

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bible_today.json
          # 갱신 시각만 바뀐 경우는 커밋하지 않는다.
          if git diff --cached -U0 | grep -E '^[+-] ' | grep -vq '"updated"'; then
            git commit -m "chore: update 오늘의 성경 한 장 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패, origin/main으로 rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
          else
            echo "No changes."
          fi
