<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가톨릭 뉴스 — 교황청 & 국내외 소식</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy: #1A2744;
            --navy-lt: #243560;
            --gold: #C9A84C;
            --gold-lt: #E2C97E;
            --cream: #F5F0E8;
            --card: #FFFFFF;
            --border: #DDD5C0;
            --text: #1A1A1A;
            --muted: #7A6F5E;
            --vatican: #6B1A1A;
            --cpbc: #1A4A6B;
            --red: #B22222;
        }
        html { scroll-behavior: smooth; }
        body { background: var(--cream); color: var(--text); font-family: 'Noto Sans KR', sans-serif; font-size: 15px; line-height: 1.7; min-height: 100vh; }
        
        /* ── HEADER ── */
        header { background: var(--navy); padding: 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 20px rgba(0,0,0,.4); }
        .header-inner { max-width: 1400px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 20px; height: 72px; }
        .cross-icon { color: var(--gold); font-size: 28px; line-height: 1; flex-shrink: 0; }
        .header-title { flex: 1; }
        .header-title h1 { font-family: 'Noto Serif KR', serif; font-size: 1.25rem; font-weight: 700; color: var(--cream); letter-spacing: .02em; }
        .header-title p { font-family: 'Cinzel', serif; font-size: .65rem; color: var(--gold); letter-spacing: .18em; text-transform: uppercase; margin-top: 1px; }
        .header-date { font-size: .8rem; color: var(--gold-lt); font-family: 'Noto Serif KR', serif; text-align: right; }
        .refresh-btn { background: transparent; border: 1px solid var(--gold); color: var(--gold); font-family: 'Cinzel', serif; font-size: .7rem; letter-spacing: .1em; padding: 6px 14px; cursor: pointer; transition: all .2s; border-radius: 2px; }
        .refresh-btn:hover { background: var(--gold); color: var(--navy); }
        
        /* ── GOLD BANNER ── */
        .gold-bar { background: linear-gradient(90deg, var(--gold) 0%, var(--gold-lt) 50%, var(--gold) 100%); height: 3px; }
        
        /* ── MARQUEE ── */
        .marquee-wrap { background: var(--navy-lt); padding: 7px 0; overflow: hidden; }
        .marquee-inner { display: flex; gap: 60px; animation: marquee 50s linear infinite; white-space: nowrap; }
        .marquee-inner span { color: var(--gold-lt); font-size: .75rem; letter-spacing: .04em; }
        .marquee-inner strong { color: var(--cream); }
        @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        
        /* ── MAIN LAYOUT ── */
        main { max-width: 1400px; margin: 0 auto; padding: 32px 24px 60px; display: grid; grid-template-columns: 1fr 4px 1fr; gap: 0 28px; }
        
        /* ── GOLD DIVIDER ── */
        .divider { position: relative; display: flex; justify-content: center; }
        .divider-line { width: 2px; background: linear-gradient(to bottom, transparent, var(--gold) 10%, var(--gold) 90%, transparent); height: 100%; }
        .divider-cross { position: sticky; top: 110px; width: 28px; height: 28px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--navy); font-size: 14px; font-weight: 700; flex-shrink: 0; box-shadow: 0 0 0 4px var(--cream); margin-left: -14px; }
        
        /* ── SECTION HEADERS ── */
        .section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--border); }
        .section-badge { padding: 3px 10px; font-family: 'Cinzel', serif; font-size: .6rem; letter-spacing: .15em; text-transform: uppercase; border-radius: 2px; }
        .badge-vatican { background: var(--vatican); color: var(--cream); }
        .badge-korea { background: var(--cpbc); color: var(--cream); }
        .section-title { font-family: 'Noto Serif KR', serif; font-size: 1.15rem; font-weight: 700; color: var(--navy); }
        .news-count { margin-left: auto; font-size: .75rem; color: var(--muted); }
        
        /* ── TABS ── */
        .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .tab-btn { padding: 5px 14px; border: 1px solid var(--border); background: white; color: var(--muted); font-family: 'Noto Sans KR', sans-serif; font-size: .75rem; cursor: pointer; border-radius: 2px; transition: all .2s; }
        .tab-btn:hover { border-color: var(--gold); color: var(--navy); }
        .tab-btn.active { background: var(--navy); color: var(--cream); border-color: var(--navy); }
        
        /* ── CARDS ── */
        .cards { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--gold); padding: 14px 16px; transition: all .2s; border-radius: 0 3px 3px 0; position: relative; overflow: hidden; }
        .card:hover { border-left-color: var(--navy); box-shadow: 0 4px 16px rgba(26,39,68,.12); transform: translateX(2px); }
        .card-source { font-size: .68rem; font-family: 'Cinzel', serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
        .card-title { font-family: 'Noto Serif KR', serif; font-size: .92rem; font-weight: 600; color: var(--navy); line-height: 1.45; margin-bottom: 6px; }
        .card-title a { color: inherit; text-decoration: none; }
        .card-title a:hover { color: var(--vatican); }
        .card-desc { font-size: .78rem; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-footer { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .card-date { font-size: .7rem; color: #AAA; margin-left: auto; }
        .card-tag { font-size: .65rem; padding: 2px 7px; border-radius: 2px; background: #F0EBE0; color: var(--muted); }
        
        /* ── SKELETON ── */
        .skeleton { animation: pulse 1.5s ease-in-out infinite; }
        .skeleton-item { background: #E8E4DC; border-radius: 3px; margin-bottom: 12px; height: 80px; }
        .skeleton-item:nth-child(2) { height: 65px; opacity: .7; }
        .skeleton-item:nth-child(3) { height: 72px; opacity: .5; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
        
        /* ── FEATURE CARD (top story) ── */
        .feature-card { background: var(--navy); border-left: 4px solid var(--gold); padding: 16px; margin-bottom: 16px; border-radius: 0 3px 3px 0; position: relative; }
        .feature-card::after { content: '✦'; position: absolute; top: 14px; right: 16px; color: var(--gold); font-size: 12px; }
        .feature-card .card-source { color: var(--gold-lt); }
        .feature-card .card-title a { color: var(--cream); font-size: 1rem; }
        .feature-card .card-title a:hover { color: var(--gold); }
        .feature-card .card-desc { color: #AAA; }
        .feature-card .card-date { color: #888; }
        
        /* ── ERROR STATE ── */
        .error-msg { background: #FFF5F5; border: 1px solid #FFCCCC; border-left: 4px solid var(--red); padding: 12px 16px; font-size: .8rem; color: #A00; border-radius: 0 3px 3px 0; margin-bottom: 15px; }
        .error-msg a { color: var(--red); font-weight: bold; text-decoration: underline; }
        
        /* ── FOOTER ── */
        footer { background: var(--navy); color: var(--muted); text-align: center; padding: 24px; font-size: .75rem; }
        footer a { color: var(--gold); text-decoration: none; }
        footer p + p { margin-top: 6px; }
        .footer-cross { font-size: 1.5rem; color: var(--gold); display: block; margin-bottom: 10px; }
        
        /* ── RESPONSIVE ── */
        @media (max-width: 900px) { main { grid-template-columns: 1fr; grid-template-rows: auto; gap: 32px; } .divider { display: none; } }
        @media (max-width: 600px) { .header-inner { height: 60px; } .header-title h1 { font-size: 1rem; } .header-date { display: none; } }
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="cross-icon">✝</div>
            <div class="header-title">
                <h1>가톨릭 뉴스 포털</h1>
                <p>Nuntii Catholici · Vatican &amp; Korea</p>
            </div>
            <div class="header-date" id="headerDate"></div>
            <button class="refresh-btn" onclick="refreshAll()">↺ 새로고침</button>
        </div>
    </header>
    <div class="gold-bar"></div>

    <div class="marquee-wrap">
        <div class="marquee-inner" id="marqueeInner">
            <span>✦ <strong>교황청 소식</strong> 로딩 중...</span>
            <span>✦ <strong>Vatican News</strong> Loading...</span>
            <span>✦ <strong>가톨릭 평화 방송</strong> 연결 중...</span>
            <span>✦ <strong>교황청 소식</strong> 로딩 중...</span>
            <span>✦ <strong>Vatican News</strong> Loading...</span>
            <span>✦ <strong>가톨릭 평화 방송</strong> 연결 중...</span>
        </div>
    </div>

    <main>
        <section>
            <div class="section-header">
                <span class="section-badge badge-vatican">Holy See</span>
                <h2 class="section-title">교황청 · Vatican News</h2>
                <span class="news-count" id="vaticanCount"></span>
            </div>
            <div class="tabs" id="vaticanTabs">
                <button class="tab-btn active" onclick="switchVaticanFeed('ko_all', this)">전체</button>
                <button class="tab-btn" onclick="switchVaticanFeed('ko_pope', this)">교황</button>
                <button class="tab-btn" onclick="switchVaticanFeed('ko_church', this)">세계교회</button>
                <button class="tab-btn" onclick="switchVaticanFeed('ko_vatican', this)">바티칸</button>
            </div>
            <div id="vaticanFeed">
                <div class="skeleton">
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                </div>
            </div>
        </section>

        <div class="divider">
            <div class="divider-line"></div>
        </div>

        <section>
            <div class="section-header">
                <span class="section-badge badge-korea">Korea</span>
                <h2 class="section-title">국내 가톨릭 뉴스</h2>
                <span class="news-count" id="koreaCount"></span>
            </div>
            <div class="tabs" id="koreaTabs">
                <button class="tab-btn active" onclick="switchKoreaFeed('cpbc', this)">평화방송</button>
                <button class="tab-btn" onclick="switchKoreaFeed('cbc', this)">가톨릭신문</button>
                <button class="tab-btn" onclick="switchKoreaFeed('osv', this)">해외(영문)</button>
            </div>
            <div id="koreaFeed">
                <div class="skeleton">
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                    <div class="skeleton-item"></div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <span class="footer-cross">✝</span>
        <p>가톨
