<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>묵주기도 묵상글</title>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1A2744; --gold:#B98A2F; --gold-soft:#E4CE96;
  --ink:#22303F; --muted:#6B7A8C; --bg:#F7F4EE; --card:#FFFFFF; --line:#E3DCCD;
  --serif:'Noto Serif KR', serif; --sans:'Noto Sans KR', -apple-system, sans-serif;
  --c-joyful:#3F7FBF; --c-luminous:#C9971C; --c-sorrowful:#7B3B8F; --c-glorious:#B5452F;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.75;padding:0 0 40px}
a{color:var(--navy)}
header{background:linear-gradient(160deg,#1A2744,#2B3F6B);color:#fff;padding:26px 18px 22px;text-align:center;position:relative}
header h1{font-family:var(--serif);font-size:21px;font-weight:700}
header p{font-size:12.5px;color:#C7D4E4;margin-top:4px}
header .back{position:absolute;top:14px;left:14px;font-size:12px;color:#C7D4E4;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 12px}
main{max-width:720px;margin:0 auto;padding:18px 16px}

/* 신비 종류 탭 */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px}
.tab{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px 6px;cursor:pointer;font-family:var(--serif);font-weight:700;font-size:14px;color:var(--ink);line-height:1.3;position:relative}
.tab small{display:block;font-family:var(--sans);font-weight:400;font-size:11px;color:var(--muted)}
.tab[aria-selected="true"]{color:#fff;border-color:transparent;background:var(--tc)}
.tab[aria-selected="true"] small{color:rgba(255,255,255,.85)}
.tab .today{position:absolute;top:-7px;right:-4px;background:var(--gold);color:#fff;font-family:var(--sans);font-size:10px;font-weight:700;border-radius:10px;padding:0 6px;line-height:16px}
.tab[data-key="joyful"]{--tc:var(--c-joyful)}
.tab[data-key="luminous"]{--tc:var(--c-luminous)}
.tab[data-key="sorrowful"]{--tc:var(--c-sorrowful)}
.tab[data-key="glorious"]{--tc:var(--c-glorious)}

.panel{display:none}
.panel.on{display:block}
.intro{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--pc);border-radius:14px;padding:14px 16px;margin-bottom:12px;font-size:14px}
.intro h2{font-family:var(--serif);font-size:18px;color:var(--pc);margin-bottom:4px}
.intro .day{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.intro p+p{margin-top:6px}

.decade{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;box-shadow:0 2px 8px rgba(30,53,87,.05)}
.decade summary{cursor:pointer;list-style:none;padding:13px 16px;display:flex;gap:10px;align-items:flex-start}
.decade summary::-webkit-details-marker{display:none}
.decade .no{flex:0 0 auto;background:var(--pc);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:1px 8px;margin-top:2px}
.decade .tt{flex:1;font-family:var(--serif);font-weight:700;color:var(--navy);font-size:15px}
.decade .ar{flex:0 0 auto;font-size:12px;color:var(--gold);font-weight:700;margin-top:3px}
.decade[open] .ar{transform:rotate(180deg)}
.decade .bd{padding:0 16px 14px}
.decade .ref{font-size:12.5px;color:var(--pc);font-weight:700;margin-bottom:4px}
.decade .bd p{font-size:14.5px}
.decade .fruit{margin-top:10px;font-size:13px;color:var(--ink);background:#FBF7EC;border:1px dashed var(--gold-soft);border-radius:10px;padding:7px 11px}
.decade .fruit b{color:var(--gold)}

.panel[data-key="joyful"]{--pc:var(--c-joyful)}
.panel[data-key="luminous"]{--pc:var(--c-luminous)}
.panel[data-key="sorrowful"]{--pc:var(--c-sorrowful)}
.panel[data-key="glorious"]{--pc:var(--c-glorious)}

.tools{display:flex;justify-content:flex-end;gap:8px;margin:2px 0 8px}
.tools button{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:3px 12px;font-size:12px;color:var(--muted);cursor:pointer;font-family:var(--sans)}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.links a{display:inline-block;font-size:13px;font-weight:700;text-decoration:none;color:var(--navy);border:1.5px solid var(--gold);border-radius:20px;padding:6px 14px;background:var(--card)}
.note{font-size:12.5px;color:var(--muted);margin-top:16px}
@media (max-width:380px){.tab{font-size:13px}}
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">← 홈</a>
  <h1>묵주기도 묵상글</h1>
  <p>환희 · 빛 · 고통 · 영광의 신비 — 각 단의 성경 말씀과 묵상</p>
</header>

<main>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="tools"><button type="button" id="toggleAll">모두 펼치기</button></div>
  <div id="panels"></div>

  <div class="links">
    <a href="rosary-guide.html">묵주기도 바치는 요령 →</a>

</main>

    { key:'glorious', name:'영광의 신비', day:'수·일', days:[0,3], yt:'yzA8VK896u4',
      intro:['예수님의 부활과 승천, 성령 강림을 묵상하고, 성모 마리아를 하늘에 불러올리시어 천상 모후의 관을 씌워 주셨음을 묵상합니다.',
             '죽음을 이기신 주님의 승리 안에서 우리에게 약속된 영원한 생명의 희망을 바라봅니다.'],
      decades:[
        { t:'예수님께서 부활하심을 묵상합시다', ref:'루카 24,1-12',
          m:'예수님께서는 사흗날에 무덤에서 부활하셨습니다. 천사는 여인들에게 “어찌하여 살아 계신 분을 죽은 이들 가운데에서 찾고 있느냐? 그분께서는 여기에 계시지 않는다. 되살아나셨다.”(루카 24,5-6) 하고 알렸습니다. 주님의 부활은 죽음과 죄에 대한 완전한 승리이며 우리 믿음의 근거입니다.',
          f:'믿음' },
        { t:'예수님께서 승천하심을 묵상합시다', ref:'사도 1,6-11',
          m:'부활하신 주님께서는 제자들이 보는 앞에서 하늘로 오르시어 하느님 오른편에 앉으셨습니다. 예수님의 승천은 그리스도를 통해 구원된 우리도 하늘 나라에 들어갈 수 있음을 보여 주는 희망의 사건이며, 다시 오실 주님을 기다리게 합니다.',
          f:'희망과 하늘을 향한 마음' },
        { t:'예수님께서 성령을 보내심을 묵상합시다', ref:'사도 2,1-13',
          m:'오순절에 성모님과 함께 기도하던 제자들 위로 불꽃 모양의 혀들이 내려앉으며 모두 성령으로 가득 찼습니다. 성령의 힘을 받은 제자들은 두려움을 떨치고 세상에 나가 용감하게 복음을 선포하였습니다. 교회가 태어난 순간입니다.',
          f:'성령의 은사와 사랑' },
        { t:'예수님께서 마리아를 하늘에 불러올리심을 묵상합시다', ref:'묵시 12,1 · 교회의 전승',
          m:'하느님께서는 원죄 없이 잉태되신 동정 마리아께서 지상 생애를 마치셨을 때 그 영혼과 육신을 함께 하늘의 영광으로 들어 올리셨습니다(성모 승천 교의, 1950). 그리스도께서는 당신 어머니를 무덤 속에 버려두지 않으셨으니, 이는 우리 모두가 누릴 부활의 영광을 미리 보여 줍니다.',
          f:'행복한 죽음과 성모 신심' },
        { t:'예수님께서 마리아께 천상 모후의 관을 씌우심을 묵상합시다', ref:'묵시 12,1',
          m:'“하늘에 큰 표징이 나타났습니다. 태양을 입고 발밑에 달을 두고 머리에 열두 개의 별로 된 관을 쓴 여인이었습니다.”(묵시 12,1) 성모님께서는 하늘과 땅의 모후로서 늘 아드님 곁에서 우리를 위해 빌어 주십니다. 주님을 굳게 믿고 따르면 하늘 나라에 이를 수 있다는 희망을 몸소 보여 주십니다.',
          f:'성모님께 대한 신뢰와 항구함' }
      ]}
  ];
  var YT_LIST = 'PLpB9z9SOeZQc92kRSSNEqKXf1VeNhmkyR';

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // 한국 시간 기준 요일
  var kst = new Date(Date.now() + (new Date().getTimezoneOffset() + 540) * 60000);
  var dow = kst.getDay();
  var todayKey = MYSTERIES.filter(function(m){ return m.days.indexOf(dow) >= 0; })[0].key;

  var tabsEl = document.getElementById('tabs');
  var panelsEl = document.getElementById('panels');
  tabsEl.innerHTML = MYSTERIES.map(function(m){
    return '<button type="button" class="tab" role="tab" data-key="' + m.key + '" aria-controls="p-' + m.key + '">' +
      esc(m.name.replace(' 신비','')) + '<small>' + esc(m.day) + '</small>' +
      (m.key === todayKey ? '<span class="today">오늘</span>' : '') + '</button>';
  }).join('');
  panelsEl.innerHTML = MYSTERIES.map(function(m){
    return '<section class="panel" role="tabpanel" id="p-' + m.key + '" data-key="' + m.key + '">' +
      '<div class="intro"><h2>' + esc(m.name) + '</h2><div class="day">' + esc(m.day) + '요일에 바칩니다' +
      (m.key === todayKey ? ' · <b style="color:var(--gold)">오늘의 신비</b>' : '') + '</div>' +
      m.intro.map(function(p){ return '<p>' + esc(p) + '</p>'; }).join('') + '</div>' +
      m.decades.map(function(d, i){
        return '<details class="decade"' + (i === 0 ? ' open' : '') + '><summary>' +
          '<span class="no">' + (i + 1) + '단</span><span class="tt">' + esc(d.t) + '</span><span class="ar">▼</span></summary>' +
          '<div class="bd"><div class="ref">📖 ' + esc(d.ref) + '</div><p>' + esc(d.m) + '</p>' +
          '<div class="fruit"><b>묵상의 열매</b> · ' + esc(d.f) + '</div></div></details>';
      }).join('') + '</section>';
  }).join('');

  var ytLink = document.getElementById('ytLink');
  function select(key, push){
    var m = MYSTERIES.filter(function(x){ return x.key === key; })[0] || MYSTERIES[0];
    Array.prototype.forEach.call(tabsEl.children, function(b){ b.setAttribute('aria-selected', b.dataset.key === m.key ? 'true' : 'false'); });
    Array.prototype.forEach.call(panelsEl.children, function(p){ p.classList.toggle('on', p.dataset.key === m.key); });
    ytLink.href = 'https://www.youtube.com/watch?v=' + m.yt + '&list=' + YT_LIST;
    if (push && history.replaceState) history.replaceState(null, '', '#' + m.key);
    updateToggle();
  }
  tabsEl.addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (b) select(b.dataset.key, true);
  });

  var toggleBtn = document.getElementById('toggleAll');
  function current(){ return panelsEl.querySelector('.panel.on'); }
  function updateToggle(){
    var p = current(); if (!p) return;
    var all = p.querySelectorAll('.decade'), open = p.querySelectorAll('.decade[open]');
    toggleBtn.textContent = open.length === all.length ? '모두 접기' : '모두 펼치기';
  }
  toggleBtn.addEventListener('click', function(){
    var p = current(); if (!p) return;
    var all = p.querySelectorAll('.decade');
    var openAll = p.querySelectorAll('.decade[open]').length !== all.length;
    Array.prototype.forEach.call(all, function(d){ d.open = openAll; });
    updateToggle();
  });
  panelsEl.addEventListener('toggle', updateToggle, true);

  var hash = (location.hash || '').slice(1);
  select(MYSTERIES.some(function(m){ return m.key === hash; }) ? hash : todayKey, false);
  window.addEventListener('hashchange', function(){ select(location.hash.slice(1), false); });
})();
</script>
</body>
</html>
