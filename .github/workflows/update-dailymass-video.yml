name: Update 매일미사 영상

on:
  schedule:
    # UTC 기준 → KST 06:13 / 08:13 / 12:13 / 18:13 / 23:13 (하루 5회)
    # 미사가 새벽 5시라 영상은 아침에 올라온다. 06시 회차가 깃허브 지연으로
    # 밀리거나 업로드가 늦으면 종일 전날 영상이 보이므로 08시 회차를 더 뒀다.
    # 정각을 피하고 다른 워크플로와 분을 달리해 지연·push 충돌을 줄인다.
  - cron: '13 3,9,14,21,23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 매일미사 영상 재생목록
        run: python scripts/fetch_dailymass_video.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dailymass_video.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 매일미사 영상 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
