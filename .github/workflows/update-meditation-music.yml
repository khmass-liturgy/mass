name: Update 오늘의 묵상성가

on:
  schedule:
    # UTC 기준 → KST 22:41 (하루 1회). 영상이 자주 늘지 않으므로 하루 한 번이면 충분하다.
  - cron: '41 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 룩스챔버콰이어 성가 영상
        run: python scripts/fetch_meditation_music.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/meditation_music.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 오늘의 묵상성가 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패, origin/main으로 rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
          fi
