name: Update 오늘의 성경 한 장

on:
  schedule:
    # UTC 기준 → KST 21:17 (매일)
    # 지난 7일·오늘·내일 장을 받아 두므로, 저녁에 받아 두면 자정이 지나도 바로 읽을 수 있다.
    # 정각을 피하고 다른 워크플로와 분을 달리해 지연·push 충돌을 줄인다.
  - cron: '17 12 * * *'
  workflow_dispatch: {}
  # 스크립트나 이 워크플로를 고치면 바로 한 번 돌려 본문·음성을 다시 만든다.
  push:
    branches: [main]
    paths:
      - scripts/fetch_bible_today.py
      - .github/workflows/update-bible-today.yml

permissions:
  contents: write

concurrency:
  group: bible-today
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests edge-tts

      - name: Fetch 지난 7일·오늘·내일 성경 본문 + 읽어주기 음성
        run: python scripts/fetch_bible_today.py --audio

      # 음성 mp3 는 main 을 키우지 않도록 'bible-audio' 브랜치에 받은 날짜(최대 9일)의 파일만 담은
      # 커밋 하나로 덮어쓴다(이전 파일은 이력에 남지 않는다). 재생은 그 커밋에 고정한
      # jsDelivr 주소로 한다 — 올바른 audio/mpeg 형식이고, 새 커밋이라 캐시가 꼬이지 않는다.
      # 올리고 jsDelivr 에서 받아지는 것을 확인한 뒤에야 JSON 을 커밋한다.
      - name: Publish 음성 to bible-audio branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls build/bible_audio/*.mp3 >/dev/null 2>&1 || { echo "음성 없음"; exit 0; }
          cd build/bible_audio
          git init -q -b bible-audio
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.mp3
          git commit -q -m "성경 읽어주기 음성 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bible-audio
          sha=$(git rev-parse HEAD)
          cd "$GITHUB_WORKSPACE"
          python - "$sha" <<'EOF'
          import json, sys, os
          p = "data/bible_today.json"
          d = json.load(open(p, encoding="utf-8"))
          for day in d["days"]:
              a = day.get("audio")
              if a:
                  a["url"] = f"https://cdn.jsdelivr.net/gh/{os.environ['GITHUB_REPOSITORY']}@{sys.argv[1]}/{a['file']}"
                  print(a["url"])
          with open(p, "w", encoding="utf-8", newline="\n") as f:
              json.dump(d, f, ensure_ascii=False, indent=1)
              f.write("\n")
          EOF
          for u in $(python -c "import json;print(' '.join(x['audio']['url'] for x in json.load(open('data/bible_today.json',encoding='utf-8'))['days'] if x.get('audio')))"); do
            for i in 1 2 3 4 5 6; do
              curl -sfI "$u" | grep -qi '^content-type: audio/mpeg' && { echo "ok $u"; break; }
              sleep 10
            done
          done
          # 예전에 쓰던 Release 저장소는 지운다.
          gh release delete bible-audio --cleanup-tag -y 2>/dev/null || true

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bible_today.json
          # 갱신 시각만 바뀐 경우는 커밋하지 않는다.
          if git diff --cached -U0 | grep -E '^[+-] ' | grep -vq '"updated"'; then
            git commit -m "chore: update 오늘의 성경 한 장 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패, origin/main으로 rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
          else
            echo "No changes."
          fi
