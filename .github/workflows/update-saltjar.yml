name: Update 소금항아리

on:
  schedule:
    # UTC 기준 → KST 06:00 / 12:00 / 18:00 / 23:00 (하루 4회)
    # '듣는 소금항아리'는 보통 전날 저녁 9시(KST)에 올라오므로 23:00 회차에서 대부분 잡힌다.
  - cron: '0 3,9,14,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 소금항아리 latest video
        run: python scripts/fetch_saltjar.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/saltjar.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 소금항아리 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
