name: Update 오늘 복음 대표 말씀

on:
  schedule:
    # UTC 기준 → KST 05:07, 3일에 한 번(매월 1·4·7… 일, UTC 날짜 기준).
    # 한 번에 오늘부터 10일 앞까지 받아 두므로 3일 간격이어도 비는 날이 없고,
    # 한 번 건너뛰어도(6일 간격) 아직 남는다. 실행 횟수를 줄여 Actions 사용량을 아낀다.
    # 정각을 피해 분을 달리한다.
  - cron: '7 20 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 복음 대표 말씀
        run: python scripts/fetch_gospel_summary.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gospel_summary.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 복음 대표 말씀 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패, origin/main으로 rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
          fi
