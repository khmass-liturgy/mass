<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>미리보기 — 가톨릭 신앙생활 포털</title>
<style>
  :root{
    --navy:#1A2744; --gold:#C9A84C; --cream:#F5F0E8; --border:#DDD5C0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--cream);font-family:'Noto Sans KR',sans-serif;}
  #bar{
    position:fixed;top:0;left:0;right:0;height:52px;z-index:10;
    display:flex;align-items:center;gap:6px;padding:0 8px;
    background:var(--navy);color:#fff;
  }
  #bar button, #bar a{
    display:flex;align-items:center;justify-content:center;gap:4px;
    background:rgba(255,255,255,.12);color:#fff;border:none;
    border-radius:6px;padding:8px 10px;font-size:.8rem;
    text-decoration:none;cursor:pointer;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  #bar button:active, #bar a:active{background:rgba(255,255,255,.28);}
  #back{flex:0 0 auto;}
  #zoomGroup{flex:0 0 auto;display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.08);border-radius:6px;padding:2px;}
  #zoomGroup button{padding:7px 10px;background:transparent;font-size:1rem;font-weight:700;}
  #zoomGroup button:active{background:rgba(255,255,255,.25);}
  #zoomPct{font-size:.72rem;color:var(--gold);min-width:34px;text-align:center;}
  #openNew{flex:0 0 auto;}
  #skipBtn{flex:0 0 auto;}
  #title{ display:none; }
  #wrap{
    position:absolute; top:52px; left:0; right:0; bottom:0;
    overflow:auto; /* 세로+가로 모두 스크롤 가능하게: 폭 고정 요소가 있어도 잘린 부분을 볼 수 있도록 */
    -webkit-overflow-scrolling:touch;
    background:#fff;
  }
  #frame{
    display:block; border:0; transform-origin:0 0; background:#fff;
  }
  #hint{
    display:none; position:absolute; top:52px; left:0; right:0; bottom:0;
    align-items:center; justify-content:center; text-align:center; padding:30px;
    color:var(--navy); font-size:.95rem; line-height:1.7; background:var(--cream);
  }
  #hint a{color:var(--navy); font-weight:700;}
  @media (min-width:480px){
    #title{
      display:block; flex:1 1 auto; overflow:hidden; text-overflow:ellipsis;
      white-space:nowrap; font-size:.8rem; color:var(--gold); margin:0 4px;
    }
  }
</style>
</head>
<body>

<div id="bar">
  <button id="back" onclick="history.length>1?history.back():location.href='index.html'">← 뒤로</button>
  <span id="title">불러오는 중…</span>
  <div id="zoomGroup">
    <button id="zoomOut" aria-label="축소">−</button>
    <span id="zoomPct">130%</span>
    <button id="zoomIn" aria-label="확대">+</button>
  </div>
  <button id="skipBtn" aria-label="본문으로 건너뛰기">본문↓</button>
  <a id="openNew" href="#" target="_blank" rel="noopener">새 창 ↗</a>
</div>

<div id="wrap">
  <iframe id="frame" scrolling="yes"></iframe>
</div>

<div id="hint">
  <div>
    이 페이지는 미리보기를 지원하지 않는 것 같습니다.<br/>
    아래 버튼으로 새 창에서 열어주세요.<br/><br/>
    <a id="hintOpen" href="#" target="_blank" rel="noopener">새 창에서 열기 ↗</a>
  </div>
</div>

<script>
(function(){
  var params = new URLSearchParams(location.search);
  var url = params.get('u');
  var title = params.get('t') || url || '';

  // 이 페이지가 신뢰하는 도메인의 게시글만 열어준다 (임의 URL을 우리 도메인 UI로
  // 감싸서 보여주는 오픈 리다이렉트/피싱 악용을 막기 위함).
  var ALLOWED_HOSTS = ['catholic.or.kr', 'naver.com'];
  function isAllowedUrl(u){
    try {
      var host = new URL(u, location.href).hostname.toLowerCase();
      return ALLOWED_HOSTS.some(function(h){ return host === h || host.endsWith('.' + h); });
    } catch(e) { return false; }
  }
  if (url && !isAllowedUrl(url)) { url = ''; }
  // 원본이 대략 이 정도 폭의 데스크톱 레이아웃이라고 가정한다.
  // zoom이 커질수록 이 폭을 "더 좁게" 다시 가정해서(=창을 좁힌 것처럼) 다시 그리게 하고,
  // 화면 폭에는 항상 정확히 맞춰 스케일하므로 좌우로 잘리는 일이 없다.
  var BASE_WIDTH = parseInt(params.get('w'), 10) || 760;

  var ZOOM_KEY = 'khmass_view_zoom';
  var MIN_ZOOM = 0.8, MAX_ZOOM = 2.5, STEP = 0.15;
  var zoom = parseFloat(localStorage.getItem(ZOOM_KEY) || '1.3');
  if(isNaN(zoom) || zoom < MIN_ZOOM || zoom > MAX_ZOOM) zoom = 1.3;

  document.getElementById('title').textContent = title;
  document.title = title + ' — 미리보기';

  var zoomPctEl = document.getElementById('zoomPct');

  if(!url){
    document.getElementById('hint').style.display = 'flex';
    document.getElementById('hint').firstElementChild.innerHTML = '열어야 할 주소가 없습니다.';
  } else {
    var target = url;
    document.getElementById('openNew').href = target;
    document.getElementById('hintOpen').href = target;

    var frame = document.getElementById('frame');
    var wrap = document.getElementById('wrap');
    var hint = document.getElementById('hint');
    var loaded = false;

    function layout(){
      // zoom이 클수록 더 좁은 폭으로 다시 그려서(effectiveWidth↓) 상대적 글자 크기를 키운다.
      var effectiveWidth = BASE_WIDTH / zoom;
      var scale = wrap.clientWidth / effectiveWidth;   // 이 스케일로 그리면 폭이 항상 화면에 정확히 맞음
      frame.style.width = effectiveWidth + 'px';
      var h = Math.max(wrap.clientHeight / scale, 2000);
      frame.style.height = h + 'px';
      frame.style.transform = 'scale(' + scale + ')';
      zoomPctEl.textContent = Math.round(zoom * 100) + '%';
    }

    frame.addEventListener('load', function(){
      loaded = true;
      try {
        var doc = frame.contentWindow.document;
        var h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
        if(h > 0){
          frame.style.height = h + 'px';
        }
      } catch(e) { /* cross-origin: 높이 재계산 불가, 기본값 유지 */ }
    });

    document.getElementById('zoomIn').addEventListener('click', function(){
      zoom = Math.min(MAX_ZOOM, Math.round((zoom + STEP) * 100) / 100);
      localStorage.setItem(ZOOM_KEY, zoom);
      layout();
    });
    document.getElementById('zoomOut').addEventListener('click', function(){
      zoom = Math.max(MIN_ZOOM, Math.round((zoom - STEP) * 100) / 100);
      localStorage.setItem(ZOOM_KEY, zoom);
      layout();
    });

    // 이 게시판은 보통 상단 메뉴/배너/탭/제목표가 원본 기준 약 650px 정도를 차지한다.
    // 교차 출처(iframe) 안쪽은 직접 스크롤을 제어할 수 없으므로,
    // 우리 쪽 바깥 컨테이너(wrap)를 그만큼 대신 내려주는 방식으로 "본문 건너뛰기"를 구현한다.
    var SKIP_ORIG_PX = parseInt(params.get('skip'), 10) || 650;
    document.getElementById('skipBtn').addEventListener('click', function(){
      var effectiveWidth = BASE_WIDTH / zoom;
      var scale = wrap.clientWidth / effectiveWidth;
      wrap.scrollTo({ top: SKIP_ORIG_PX * scale, behavior: 'smooth' });
    });

    window.addEventListener('resize', layout);
    layout();
    frame.src = target;

    setTimeout(function(){
      if(!loaded){
        hint.style.display = 'flex';
      }
    }, 4000);
  }
})();
</script>

</body>
</html>
