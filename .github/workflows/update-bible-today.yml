name: Update 오늘의 성경 한 장

on:
  schedule:
    # UTC 기준 → KST 21:17 (매일)
    # 오늘·내일 두 장을 받아 두므로, 저녁에 받아 두면 자정이 지나도 바로 읽을 수 있다.
    # 정각을 피하고 다른 워크플로와 분을 달리해 지연·push 충돌을 줄인다.
  - cron: '17 12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 오늘·내일 성경 본문
        run: python scripts/fetch_bible_today.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/bible_today.json
          # 갱신 시각만 바뀐 경우는 커밋하지 않는다.
          if git diff --cached -U0 | grep -E '^[+-] ' | grep -vq '"updated"'; then
            git commit -m "chore: update 오늘의 성경 한 장 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패, origin/main으로 rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
          else
            echo "No changes."
          fi
