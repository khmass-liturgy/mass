<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘의 성경 한 장 ✚ 읽어주기</title>
<meta name="description" content="창세기부터 요한 묵시록까지 날마다 한 장 — 본문을 보며 기기의 음성으로 들을 수 있습니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --marian:#274B77;
  --marian-dark:#1B3557;
  --gold:#B98A2F;
  --gold-soft:#E4CE96;
  --ink:#22303F;
  --muted:#6B7A8C;
  --bg:#F4F6F9;
  --card:#FFFFFF;
  --line:#DDE4EC;
  --radius:14px;
  --serif:'Noto Serif KR', serif;
  --sans:'Noto Sans KR', -apple-system, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.55;padding-bottom:24px}
a{color:var(--marian)}

header{background:linear-gradient(160deg,var(--marian-dark),var(--marian));color:#fff;padding:26px 18px 30px;text-align:center;position:relative}
header .cross{font-size:15px;letter-spacing:8px;color:var(--gold-soft);margin-bottom:8px}
header h1{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:1px}
header p{font-size:13px;color:#C7D4E4;margin-top:6px;word-break:keep-all}
header .home{position:absolute;top:14px;right:14px;font-size:12px;color:#C7D4E4;text-decoration:none;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 12px}

main{max-width:680px;margin:0 auto;padding:18px 16px}
.player{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;box-shadow:0 3px 10px rgba(30,53,87,.08);margin-bottom:12px}
.pbtn{flex:none;height:40px;border:none;border-radius:20px;padding:0 16px;font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;background:var(--marian);color:#fff}
.pbtn.ghost{background:#fff;color:var(--marian);border:1.5px solid var(--line)}
.pbtn.on{background:var(--gold)}
.pbtn:disabled{background:var(--line);color:var(--muted);cursor:default}
.rate[hidden]{display:none}
.rate{flex:none;height:36px;border:1.5px solid var(--line);border-radius:18px;padding:0 10px;font-family:var(--sans);font-size:13px;color:var(--ink);background:#fff}
.pstate{flex:1;min-width:120px;font-size:12.5px;color:var(--muted);text-align:right;word-break:keep-all}
.notice{font-size:13px;color:#8A5A12;background:#FBF3E0;border:1px solid var(--gold-soft);border-radius:10px;padding:9px 12px;margin-bottom:12px;word-break:keep-all}
.notice[hidden]{display:none}

.text{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:8px 16px 14px;box-shadow:0 3px 10px rgba(30,53,87,.06)}
.chap{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--marian);text-align:center;margin:12px 0 4px}
.chap small{display:block;font-family:var(--sans);font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.head{font-family:var(--serif);font-weight:600;font-size:15.5px;color:var(--gold);margin:16px 0 4px;cursor:pointer}
.verse{display:flex;gap:10px;padding:5px 6px;margin:0 -6px;border-radius:8px;cursor:pointer;font-family:var(--serif);font-size:16.5px;line-height:1.8;word-break:keep-all;transition:background .2s}
.verse .vn{flex:none;min-width:22px;font-family:var(--sans);font-size:11.5px;font-weight:700;color:var(--gold);padding-top:6px;text-align:right}
.verse .vt{flex:1;white-space:pre-line}
.verse.cur,.head.cur{background:#FBF1D6}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days[hidden]{display:none}
.day{flex:none;min-width:74px;padding:6px 8px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;line-height:1.35;word-break:keep-all}
.day b{display:block;font-size:12.5px;font-weight:500;color:var(--ink)}
.day.read{border-color:var(--gold-soft);background:#FBF6E8}
.day.sel{border-color:var(--marian);background:var(--marian);color:#C7D4E4}
.day.sel b{color:#fff}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:14px;word-break:keep-all}
.achv{background:var(--card);border:1px solid var(--gold-soft);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.achv summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:14px;font-weight:500;color:var(--ink);word-break:keep-all}
.achv summary::-webkit-details-marker{display:none}
.achv summary::after{content:'▼';float:right;font-size:11px;color:var(--muted);margin-top:3px}
.achv[open] summary::after{content:'▲'}
.achv summary .hl{color:var(--gold);font-weight:700}
#achvBody{padding:2px 14px 14px;border-top:1px solid var(--line)}
.prog{margin-top:10px;font-size:12.5px;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:#EEF1F5;overflow:hidden;margin:5px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#D9B25C);border-radius:5px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#F8F5EC;border-radius:10px;padding:8px 4px;text-align:center}
.stat b{display:block;font-family:var(--serif);font-size:19px;color:var(--marian)}
.stat span{font-size:11.5px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-top:12px}
.badge{border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:11.5px;color:var(--muted);line-height:1.35;word-break:keep-all}
.badge .bi{display:block;font-size:22px;filter:grayscale(1);opacity:.35}
.badge.on{border-color:var(--gold-soft);background:#FBF6E8;color:var(--ink);font-weight:500}
.badge.on .bi{filter:none;opacity:1}
.done-btn{display:block;width:100%;margin-top:12px;padding:13px;border:none;border-radius:var(--radius);background:var(--marian);color:#fff;font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer}
.done-btn.on{background:#fff;color:var(--gold);border:1.5px solid var(--gold-soft);cursor:default}
.done-btn[hidden]{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);max-width:calc(100% - 32px);background:var(--marian-dark);color:#fff;font-size:14px;padding:11px 18px;border-radius:22px;box-shadow:0 6px 18px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;text-align:center;word-break:keep-all;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
footer{max-width:680px;margin:8px auto 0;padding:0 16px;font-size:12px;color:var(--muted);text-align:center;word-break:keep-all}
</style>
</head>
<body>

<header>
  <a class="home" href="https://khmass-liturgy.github.io/mass/">⛪ 메인으로</a>
  <div class="cross">✚ ✚ ✚</div>
  <h1>오늘의 성경 한 장</h1>
  <p>창세기부터 요한 묵시록까지 날마다 한 장 · ▶를 누르면 읽어 드립니다 · 절을 누르면 거기서부터 · 다 읽으면 🏅 기록 · 지난 7일 다시 읽기 · 내일 장 미리 읽기</p>
</header>

<main>
  <div class="player">
    <button class="pbtn" id="playBtn" type="button" disabled>▶ 읽기</button>
    <button class="pbtn ghost" id="stopBtn" type="button" disabled>■ 처음으로</button>
    <select class="rate" id="rate" aria-label="읽는 빠르기">
      <option value="0.8">느리게</option>
      <option value="1" selected>보통</option>
      <option value="1.2">조금 빠르게</option>
      <option value="1.5">빠르게</option>
    </select>
    <select class="rate" id="mode" aria-label="목소리" hidden>
      <option value="file">녹음 음성</option>
      <option value="tts">기기 음성</option>
    </select>
    <span class="pstate" id="pstate"></span>
  </div>
  <div class="notice" id="notice" hidden></div>
  <nav class="days" id="days" aria-label="읽을 날 고르기" hidden></nav>
  <details class="achv" id="achv">
    <summary id="achvSum">🏅 나의 성경 읽기</summary>
    <div id="achvBody"></div>
  </details>
  <div class="text" id="text"><div class="empty">오늘의 본문을 불러오는 중…</div></div>
  <button class="done-btn" id="doneBtn" type="button" hidden>✓ 오늘의 한 장 다 읽었어요</button>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<footer>
  본문 출처: 한국천주교주교회의 「성경」 · <a id="srcLink" href="https://bible.cbck.or.kr/Knb" target="_blank" rel="noopener">bible.cbck.or.kr</a><br>
  녹음 음성은 날마다 자동으로 만든 음성(Microsoft 음성 합성)이며, 화면이 꺼져도 계속 들립니다.<br>
  기기 음성은 이 폰에 들어 있는 목소리로 읽으며, 화면이 꺼지면 멈출 수 있습니다.
</footer>

<script>
// 나의 성경 읽기 기록 — 읽은 장과 읽은 날을 이 기기(localStorage 'bibleReadLog')에 저장하고,
// 진행률·연속 일수·배지로 보여 준다. 끝까지 들으면 저절로, 눈으로 읽었으면 '다 읽었어요'로 기록한다.
// 메인 화면(index.html)의 성경 읽어주기 카드도 같은 기록을 읽어 요약을 보여 준다.
window.BibleLog = (function(){
  var KEY = 'bibleReadLog';
  // bible.cbck.or.kr/Knb 목차 순서의 장 수 (구약 46권, 신약 27권)
  var CODES = 'Gn Ex Lv Nm Dt Jos Jgs Ru 1Sm 2Sm 1Kgs 2Kgs 1Chr 2Chr Ezr Neh Tb Jdt Est 1Mc 2Mc Jb Ps Prv Eccl Sng Wis Sir Is Jer Lam Bar Ez Dn Hos Jl Am Ob Jon Mi Na Hb Zep Hg Zec Mal Mt Mk Lk Jn Acts Rom 1Cor 2Cor Gal Eph Phil Col 1Thes 2Thes 1Tm 2Tm Ti Phlm Heb Jas 1Pt 2Pt 1Jn 2Jn 3Jn Jude Rv'.split(' ');
  var COUNTS = [50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,14,16,10,16,15,42,150,31,12,8,19,51,66,52,5,6,48,14,14,4,9,1,4,7,3,3,3,2,14,3,28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];
  var OT = 46, TOTAL = 1328;
  var sumEl = document.getElementById('achvSum');
  var bodyEl = document.getElementById('achvBody');
  var doneBtn = document.getElementById('doneBtn');
  var toastEl = document.getElementById('toast');
  var daysEl = document.getElementById('days');
  var day = null, list = [], toastTimer = null;

  function load(){
    var d = null;
    try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!d || typeof d !== 'object') d = {};
    if (!d.ch || typeof d.ch !== 'object') d.ch = {};
    if (!Array.isArray(d.days)) d.days = [];
    return d;
  }
  function save(d){ try { localStorage.setItem(KEY, JSON.stringify(d)); return true; } catch (e) { return false; } }
  function todayKST(){ return new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' }); }
  function dayNum(s){ var p = s.split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
  function key(d){ return d.code + '/' + d.chapter; }

  function stats(d){
    var nums = d.days.map(dayNum).sort(function(a, b){ return a - b; });
    var best = 0, run = 0, prev = null;
    nums.forEach(function(n){ run = (prev !== null && n === prev + 1) ? run + 1 : (n === prev ? run : 1); prev = n; if (run > best) best = run; });
    var set = {}; nums.forEach(function(n){ set[n] = true; });
    var t = dayNum(todayKST()), cur = 0, s = set[t] ? t : t - 1;
    while (set[s]) { cur++; s--; }
    var booksDone = {}, doneCount = 0;
    CODES.forEach(function(c, i){
      var all = true;
      for (var k = 1; k <= COUNTS[i]; k++) if (!d.ch[c + '/' + k]) { all = false; break; }
      if (all) { booksDone[i] = true; doneCount++; }
    });
    return { total: Object.keys(d.ch).length, cur: cur, best: best, booksDone: booksDone, doneCount: doneCount };
  }
  function range(st, a, b){ for (var i = a; i <= b; i++) if (!st.booksDone[i]) return false; return true; }

  var BADGES = [
    ['🌱', '첫걸음', function(s){ return s.total >= 1; }],
    ['🔥', '3일 연속', function(s){ return s.best >= 3; }],
    ['⭐', '7일 연속', function(s){ return s.best >= 7; }],
    ['🌙', '30일 연속', function(s){ return s.best >= 30; }],
    ['👑', '100일 연속', function(s){ return s.best >= 100; }],
    ['📗', '10장', function(s){ return s.total >= 10; }],
    ['📘', '50장', function(s){ return s.total >= 50; }],
    ['📙', '100장', function(s){ return s.total >= 100; }],
    ['🗓️', '365장', function(s){ return s.total >= 365; }],
    ['📜', '창세기 완독', function(s){ return range(s, 0, 0); }],
    ['⛰️', '모세오경 완독', function(s){ return range(s, 0, 4); }],
    ['🎵', '시편 완독', function(s){ return range(s, 22, 22); }],
    ['🕯️', '구약 완독', function(s){ return range(s, 0, OT - 1); }],
    ['✝️', '4복음서 완독', function(s){ return range(s, OT, OT + 3); }],
    ['🕊️', '신약 완독', function(s){ return range(s, OT, CODES.length - 1); }],
    ['🏆', '성경 전체 완독', function(s){ return s.total >= TOTAL; }]
  ];
  function earned(st){ return BADGES.filter(function(b){ return b[2](st); }).map(function(b){ return b[1]; }); }

  function render(){
    var d = load(), st = stats(d), got = earned(st);
    sumEl.innerHTML = st.total
      ? '🏅 나의 성경 읽기 · <span class="hl">' + st.total + '장</span> · 🔥 ' + st.cur + '일 연속 · 배지 ' + got.length + '개'
      : '🏅 나의 성경 읽기 · 오늘의 한 장부터 시작해 보세요';
    var pct = Math.round(st.total / TOTAL * 1000) / 10;
    var html = '<div class="prog">성경 전체 ' + st.total + ' / ' + TOTAL + '장 (' + pct + '%)' +
      '<div class="bar"><i style="width:' + Math.min(100, st.total / TOTAL * 100) + '%"></i></div></div>' +
      '<div class="stats"><div class="stat"><b>' + st.cur + '일</b><span>지금 연속</span></div>' +
      '<div class="stat"><b>' + st.best + '일</b><span>최장 연속</span></div>' +
      '<div class="stat"><b>' + st.doneCount + '권</b><span>완독한 책</span></div></div><div class="badges">';
    BADGES.forEach(function(b){
      var on = got.indexOf(b[1]) >= 0;
      html += '<div class="badge' + (on ? ' on' : '') + '"><span class="bi">' + b[0] + '</span>' + b[1] + '</div>';
    });
    bodyEl.innerHTML = html + '</div><div class="prog">기록은 이 기기(브라우저)에만 저장됩니다.</div>';
    if (day) {
      var done = !!d.ch[key(day)];
      doneBtn.hidden = false;
      doneBtn.classList.toggle('on', done);
      doneBtn.textContent = done ? '✓ ' + day.book + ' ' + day.chapter + '장 읽기 완료'
        : (day.date === todayKST() ? '✓ 오늘의 한 장 다 읽었어요' : '✓ 이 장 다 읽었어요');
    }
    renderDays(d);
  }

  // 칸에 들어가게 책 이름을 줄인다: '사무엘기 상권' → '사무엘기 상', '코린토 신자들에게 보낸 첫째 서간' → '코린토 1서'
  function shortBook(b){
    var n = /첫째/.test(b) ? 1 : /둘째/.test(b) ? 2 : /셋째/.test(b) ? 3 : 0;
    return b.split(' ')[0] + (/ 상권$/.test(b) ? ' 상' : / 하권$/.test(b) ? ' 하' : n ? ' ' + n + '서' : '');
  }

  // 지난 7일 · 오늘 · 내일 고르는 칸. 읽은 장은 ✓ 로, 보고 있는 장은 진하게.
  function renderDays(d){
    if (!list.length) return;
    var t = dayNum(todayKST()), html = '';
    list.forEach(function(x){
      var n = dayNum(x.date) - t, p = x.date.split('-');
      var label = n === 0 ? '오늘' : n === 1 ? '내일 미리' : n === -1 ? '어제' : (+p[1]) + '/' + (+p[2]);
      var cls = 'day' + (d.ch[key(x)] ? ' read' : '') + (day && x.date === day.date ? ' sel' : '');
      html += '<a class="' + cls + '" href="bible_read.html' + (n === 0 ? '' : '?d=' + x.date) + '">' +
        (d.ch[key(x)] ? '✓ ' : '') + label + '<b>' + shortBook(x.book) + ' ' + x.chapter + '장</b></a>';
    });
    daysEl.innerHTML = html;
    daysEl.hidden = false;
    var sel = daysEl.querySelector('.sel');
    if (sel) daysEl.scrollLeft = sel.offsetLeft - daysEl.clientWidth / 2 + sel.offsetWidth / 2;
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 4000);
  }

  function mark(){
    if (!day) return;
    var d = load(), k = key(day);
    if (d.ch[k]) return;
    var before = earned(stats(d));
    var t = todayKST();
    d.ch[k] = t;
    if (d.days.indexOf(t) < 0) d.days.push(t);
    if (!save(d)) { toast('이 브라우저에서는 기록을 저장할 수 없습니다.'); return; }
    var st = stats(d);
    var fresh = earned(st).filter(function(n){ return before.indexOf(n) < 0; });
    render();
    toast('🎉 ' + day.book + ' ' + day.chapter + '장 완료! 모두 ' + st.total + '장 · 🔥 ' + st.cur + '일 연속' +
      (fresh.length ? ' · 🏅 새 배지: ' + fresh.join(', ') : ''));
  }

  doneBtn.addEventListener('click', mark);
  render();
  return { attach: function(d, all){ day = d; list = all || [d]; render(); }, mark: mark };
})();
</script>

<script>
// 본문은 scripts/fetch_bible_today.py 가 날마다 data/bible_today.json 에 받아 둔다(오늘·내일 두 장).
// 소리는 두 가지 방식이다.
//  · 녹음 음성(file): 같은 스크립트가 만든 장 전체 mp3. 부분마다 시작 시각(marks)이 있어
//    재생 위치로 읽는 절을 표시하고, 절을 누르면 그 시각으로 간다. 화면이 꺼져도 계속 재생된다.
//  · 기기 음성(tts): 기기의 음성 합성(speechSynthesis)으로 한 절씩 읽는다. 기기에 없으면 못 쓴다.
//    안드로이드 크롬은 pause()/resume() 이 잘 듣지 않아, 멈춤은 cancel 후 그 절부터 다시 읽는 방식이다.
// 녹음 음성이 있으면 그것이 기본이고, 둘 다 있을 때만 고르는 칸을 보여 준다.
(function(){
  var RATE_KEY = 'bibleReadRate', MODE_KEY = 'bibleReadMode';
  var textEl = document.getElementById('text');
  var playBtn = document.getElementById('playBtn');
  var stopBtn = document.getElementById('stopBtn');
  var rateEl = document.getElementById('rate');
  var modeEl = document.getElementById('mode');
  var stateEl = document.getElementById('pstate');
  var noticeEl = document.getElementById('notice');
  var synth = window.speechSynthesis && window.SpeechSynthesisUtterance ? window.speechSynthesis : null;
  var parts = [];      // [{el, say}] 읽을 차례 (장 제목·소제목·절)
  var marks = [];      // 녹음 음성에서 각 부분이 시작하는 시각(초)
  var pos = 0, playing = false, token = 0, voice = null, wakeLock = null, mode = 'tts', day = null;
  var audio = null;

  try { var r = localStorage.getItem(RATE_KEY); if (r) rateEl.value = r; } catch (e) {}
  function rate(){ return parseFloat(rateEl.value) || 1; }
  rateEl.addEventListener('change', function(){
    try { localStorage.setItem(RATE_KEY, rateEl.value); } catch (e) {}
    if (mode === 'file') { if (audio) audio.playbackRate = rate(); }
    else if (playing) speakFrom(pos);   // 빠르기를 바꾸면 지금 절부터 새 빠르기로
  });
  modeEl.addEventListener('change', function(){
    stop(false);
    mode = modeEl.value;
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
  });

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function notice(msg){ noticeEl.textContent = msg; noticeEl.hidden = !msg; }

  // 소리 내어 읽을 문장: 시편의 그리스어 번호 '(22)'와 '[ ]' 괄호, 행 바꿈을 정리한다.
  function sayText(t){
    return t.replace(/^\(\d+\)\s*/, '').replace(/[\[\]]/g, '').replace(/\n/g, ' ').trim();
  }

  // 장 번호를 한자어 수사로 (1 → 일, 150 → 백오십). 숫자 그대로면 '1장'을 '한 장'으로 읽는다.
  // scripts/fetch_bible_today.py 의 sino 와 같다.
  function sino(n){
    var d = '영일이삼사오육칠팔구', out = '';
    [[100, '백'], [10, '십']].forEach(function(u){
      var q = Math.floor(n / u[0]); n %= u[0];
      if (q) out += (q === 1 ? '' : d[q]) + u[1];
    });
    return out + (n ? d[n] : '');
  }

  function pickVoice(){
    if (!synth) return;
    var vs = synth.getVoices().filter(function(v){ return /^ko/i.test(v.lang); });
    voice = vs.filter(function(v){ return v.localService; })[0] || vs[0] || null;
  }
  if (synth) {
    pickVoice();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice);
  }

  function setCur(i){
    var old = textEl.querySelector('.cur');
    if (old) old.classList.remove('cur');
    var p = parts[i];
    if (!p) return;
    p.el.classList.add('cur');
    if (document.visibilityState !== 'visible') return;
    var r = p.el.getBoundingClientRect();
    if (r.top < 90 || r.bottom > window.innerHeight - 20) p.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function keepAwake(on){
    try {
      if (on && !wakeLock && navigator.wakeLock) {
        navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; l.addEventListener('release', function(){ wakeLock = null; }); }).catch(function(){});
      } else if (!on && wakeLock) { wakeLock.release(); wakeLock = null; }
    } catch (e) {}
  }
  document.addEventListener('visibilitychange', function(){ if (playing && mode === 'tts' && document.visibilityState === 'visible') keepAwake(true); });

  function render(){
    playBtn.textContent = playing ? '❚❚ 멈춤' : (pos > 0 ? '▶ 이어 읽기' : '▶ 읽기');
    playBtn.classList.toggle('on', playing);
    stateEl.textContent = parts.length ? (pos > 0 || playing ? (pos + 1) + ' / ' + parts.length : '') : '';
  }

  function finished(){
    playing = false; pos = 0; setCur(-1); keepAwake(false); render();
    stateEl.textContent = '다 읽었습니다 ✚';
    if (window.BibleLog) BibleLog.mark();   // 끝까지 들으면 읽은 장으로 기록
  }

  // ── 녹음 음성 ──
  function partAt(t){
    var i = 0;
    while (i + 1 < marks.length && marks[i + 1] <= t + 0.05) i++;
    return i;
  }
  function ensureAudio(){
    if (audio) return audio;
    audio = new Audio();
    audio.preload = 'none';
    audio.src = day.audio.url;
    audio.addEventListener('timeupdate', function(){
      if (!playing) return;
      var i = partAt(audio.currentTime);
      if (i !== pos) { pos = i; setCur(i); render(); }
    });
    audio.addEventListener('ended', finished);
    audio.addEventListener('pause', function(){ if (playing && !audio.ended) { playing = false; render(); } });   // 잠금 화면 등에서 멈춘 경우
    audio.addEventListener('play', function(){ if (!playing) { playing = true; render(); } });
    audio.addEventListener('error', function(){
      if (mode !== 'file') return;
      playing = false; render();
      if (synth) {
        mode = 'tts'; modeEl.value = 'tts'; modeEl.hidden = true;
        notice('녹음 음성을 불러오지 못해 기기 음성으로 읽습니다.');
        speakFrom(pos);
      } else {
        notice('녹음 음성을 불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요.');
        audio = null;
      }
    });
    if ('mediaSession' in navigator && window.MediaMetadata) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: day.book + ' ' + day.chapter + '장', artist: '오늘의 성경 한 장', album: '가톨릭 신앙생활 포털' });
      } catch (e) {}
    }
    return audio;
  }
  function playFile(i){
    var a = ensureAudio();
    pos = i; playing = true; setCur(i); render();
    a.playbackRate = rate();
    var seek = function(){ try { a.currentTime = marks[i] || 0; } catch (e) {} };
    if (a.readyState >= 1) seek(); else a.addEventListener('loadedmetadata', seek, { once: true });
    var p = a.play();
    if (p && p.catch) p.catch(function(){ playing = false; render(); });
  }

  // ── 기기 음성 ──
  function speakFrom(i){
    if (mode === 'file') { playFile(i); return; }
    if (!synth) return;
    var my = ++token;
    synth.cancel();
    pos = i; playing = true; keepAwake(true); render();
    (function next(){
      if (my !== token) return;
      if (pos >= parts.length) { finished(); return; }
      setCur(pos); render();
      var u = new SpeechSynthesisUtterance(parts[pos].say);
      u.lang = 'ko-KR';
      if (voice) u.voice = voice;
      u.rate = rate();
      u.onend = function(){ if (my !== token) return; pos++; setTimeout(next, 250); };
      u.onerror = function(e){
        if (my !== token || e.error === 'interrupted' || e.error === 'canceled') return;
        playing = false; keepAwake(false); render();
        if (day && day.audio) {
          mode = 'file'; modeEl.value = 'file'; modeEl.hidden = true;
          notice('이 기기 음성으로 읽을 수 없어 녹음 음성으로 바꿉니다.');
          playFile(pos);
        } else {
          notice('이 기기에서 음성을 낼 수 없습니다 (' + e.error + '). 기기 설정의 음성 출력(TTS)에 한국어가 있는지 확인해 주세요.');
        }
      };
      synth.speak(u);
    })();
  }

  function stop(resetPos){
    token++;
    if (synth) synth.cancel();
    if (audio) audio.pause();
    playing = false; keepAwake(false);
    if (resetPos) {
      pos = 0; setCur(-1);
      if (audio) { try { audio.currentTime = 0; } catch (e) {} }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    render();
  }

  playBtn.addEventListener('click', function(){ playing ? stop(false) : speakFrom(pos); });
  stopBtn.addEventListener('click', function(){ stop(true); });
  textEl.addEventListener('click', function(e){
    if (e.target.closest('a')) return;
    var el = e.target.closest('[data-i]');
    if (el && !playBtn.disabled) speakFrom(+el.getAttribute('data-i'));
  });
  window.addEventListener('pagehide', function(){ if (synth) synth.cancel(); });

  function show(d, all){
    day = d;
    document.getElementById('srcLink').href = day.url;
    var p = day.date.split('-');
    var when = day.date < today ? '지난 장 · ' + (+p[1]) + '월 ' + (+p[2]) + '일 · '
      : day.date > today ? '미리 읽기 · 내일(' + (+p[1]) + '월 ' + (+p[2]) + '일) · ' : '';
    var html = '<div class="chap" data-i="0">' + esc(day.book) + ' ' + day.chapter + '장' +
      '<small>' + when + esc(day.testament) + ' · ' + day.seq + ' / ' + day.total + ' · <a href="' + esc(day.url) + '" target="_blank" rel="noopener">원문 보기</a></small></div>';
    parts = [{ say: day.book + ' ' + sino(day.chapter) + '장' }];
    day.items.forEach(function(it){
      var i = parts.length;
      if (it.h) {
        html += '<div class="head" data-i="' + i + '">' + esc(it.h) + '</div>';
        parts.push({ say: it.h });
      } else {
        html += '<div class="verse" data-i="' + i + '"><span class="vn">' + esc(it.v) + '</span><span class="vt">' + esc(it.t) + '</span></div>';
        parts.push({ say: sayText(it.t) });
      }
    });
    textEl.innerHTML = html;
    textEl.querySelectorAll('[data-i]').forEach(function(el){ parts[+el.getAttribute('data-i')].el = el; });
    document.title = day.book + ' ' + day.chapter + '장 ✚ 오늘의 성경 읽어주기';
    if (window.BibleLog) BibleLog.attach(day, all);

    var hasFile = !!(day.audio && day.audio.url && day.audio.marks && day.audio.marks.length === parts.length);
    if (hasFile) marks = day.audio.marks;
    var saved = null;
    try { saved = localStorage.getItem(MODE_KEY); } catch (e) {}
    if (hasFile && synth) {
      modeEl.hidden = false;
      mode = saved === 'tts' ? 'tts' : 'file';
    } else {
      mode = hasFile ? 'file' : 'tts';
    }
    modeEl.value = mode;
    if (hasFile || synth) { playBtn.disabled = false; stopBtn.disabled = false; }
    else notice('읽어주기 음성을 준비하지 못했습니다. 본문은 그대로 보실 수 있습니다.');
    render();
  }

  // ?d=YYYY-MM-DD 로 지난 7일 · 내일 장을 고른다. 없거나 범위 밖이면 오늘 장.
  var today = new Date().toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
  function shift(s, n){ var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + n)).toISOString().slice(0, 10); }
  var want = (location.search.match(/[?&]d=(\d{4}-\d{2}-\d{2})/) || [])[1] || today;
  fetch('data/bible_today.json', { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var lo = shift(today, -7), hi = shift(today, 1);
      var all = (d.days || []).filter(function(x){ return x.date >= lo && x.date <= hi; });
      var pick = function(s){ return all.filter(function(x){ return x.date === s; })[0]; };
      var found = pick(want) || pick(today);
      if (!found) throw new Error('stale');
      show(found, all);
    })
    .catch(function(){
      textEl.innerHTML = '<div class="empty">오늘의 본문을 아직 받아 오지 못했습니다.<br>' +
        '<a href="https://khmass-liturgy.github.io/mass/">메인 화면</a>의 성경 카드로 원문을 보실 수 있습니다.</div>';
    });
})();
</script>
</body>
</html>
