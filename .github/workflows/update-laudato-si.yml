name: Update 찬미받으소서 오늘의 영상

on:
  schedule:
    # UTC 15:13 → KST 00:13 매일. 날짜가 바뀌자마자 그날 주제로 유튜브를 검색해 영상을 바꾼다.
    # 정각을 피하고 다른 워크플로와 분을 달리해 지연·push 충돌을 줄인다.
  - cron: '13 15 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Search 오늘의 찬미받으소서 영상
        run: python scripts/fetch_laudato_si.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/laudato_si.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 찬미받으소서 오늘의 영상 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패, origin/main으로 rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
          fi
