<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낙엽 배경</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍂</text></svg>">
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:linear-gradient(180deg,#3b2314 0%,#8a4b1f 55%,#d9923b 100%);font-family:'Noto Sans KR',sans-serif}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  .content{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff3e0;text-shadow:0 2px 12px rgba(0,0,0,.5);text-align:center;pointer-events:none}
  h1{font-size:clamp(28px,6vw,56px);margin:0 0 8px}
  p{margin:0;opacity:.85}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="content"><h1>🍂 가을</h1><p>낙엽이 떨어지는 배경</p></div>
<script>
(() => {
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const colors = ['#c0392b','#d35400','#e67e22','#f39c12','#b9770e','#a04000','#d4ac0d'];
  let W, H, dpr, leaves = [];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(80, Math.max(25, W / 18)));
    while (leaves.length < n) leaves.push(make(true));
    leaves.length = n;
  }
  function make(init){
    return {
      x: Math.random() * W,
      y: init ? Math.random() * H : -30,
      s: 10 + Math.random() * 20,
      vy: 0.6 + Math.random() * 1.2,
      sway: 20 + Math.random() * 40,
      ph: Math.random() * 6.28,
      sp: 0.01 + Math.random() * 0.02,
      rot: Math.random() * 6.28,
      vr: (Math.random() - .5) * 0.04,
      c: colors[Math.random() * colors.length | 0],
      type: Math.random() < .5 ? 0 : 1
    };
  }
  function drawLeaf(l){
    const s = l.s;
    ctx.save();
    ctx.translate(l.x, l.y);
    ctx.rotate(l.rot);
    ctx.scale(Math.cos(l.ph * 1.3) * .5 + .6, 1); // 뒤집히는 느낌
    ctx.fillStyle = l.c;
    ctx.beginPath();
    if (l.type === 0) { // 일반 잎
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo(s * .9, -s * .5, s * .7, s * .6, 0, s);
      ctx.bezierCurveTo(-s * .7, s * .6, -s * .9, -s * .5, 0, -s);
    } else { // 단풍잎 느낌
      for (let i = 0; i < 10; i++) {
        const a = i / 10 * Math.PI * 2 - Math.PI / 2;
        const r = i % 2 ? s * .45 : s;
        ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      }
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,25,5,.45)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, -s); ctx.lineTo(0, s * 1.25);
    ctx.stroke();
    ctx.restore();
  }
  function frame(){
    ctx.clearRect(0, 0, W, H);
    for (const l of leaves) {
      if (!reduce) {
        l.ph += l.sp;
        l.y += l.vy;
        l.x += Math.sin(l.ph) * 0.8;
        l.rot += l.vr;
        if (l.y > H + 30) Object.assign(l, make(false), {x: Math.random() * W});
      }
      drawLeaf(l);
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize', resize);
  resize();
  frame();
})();
</script>
</body>
</html>
