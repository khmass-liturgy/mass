name: Update 소금항아리

on:
  schedule:
    # UTC 기준 → KST 06:19 / 12:19 / 18:19 / 23:19 (하루 4회)
    # '듣는 소금항아리'는 보통 전날 저녁 9시(KST)에 올라오므로 23시 회차에서 대부분 잡힌다.
    # 정각을 피하고 다른 워크플로와 분을 달리해 지연·push 충돌을 줄인다.
  - cron: '19 3,9,14,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 소금항아리 latest video
        run: python scripts/fetch_saltjar.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/saltjar.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 소금항아리 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "push 실패, origin/main으로 rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
          fi
