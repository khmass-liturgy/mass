name: Update 묵상 posts

on:
  schedule:
    # UTC 기준 → KST 04:30 / 10:30 / 16:30 / 22:30 (하루 4회)
    - cron: '30 19,1,7,13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch 묵상 posts
        run: python scripts/fetch_muksang.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/muksang.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 묵상 posts ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
