name: Update 빈첸시오말씀방

on:
  schedule:
    # UTC 기준 → KST 06:00 / 12:00 / 18:00 / 23:00 (하루 4회)
    # '[묵상]' 영상은 보통 이른 아침(KST 06~07시)에 올라오므로 06:00 회차에서 대부분 잡힌다.
  - cron: '0 3,9,14,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch 빈첸시오말씀방 videos
        run: python scripts/fetch_vincent.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vincent.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update 빈첸시오말씀방 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST'))"
            git push
          fi
